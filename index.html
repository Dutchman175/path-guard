<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Path Guard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Path Guard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0f1419;
    color: #e8eef4;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
    touch-action: manipulation;
overscroll-behavior: none;
  }
  html, body {
    height: 100%;
    height: 100dvh;
    overscroll-behavior: none;
  }
  #app {
    min-height: 100%;
    min-height: 100dvh;
    max-width: none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (display-mode: standalone), (display-mode: fullscreen) {
    body { background: #0f1419; }
    #app { border-radius: 0; }
    canvas { border-radius: 0; border-left: none; border-right: none; }
  }

  #app {
    width: 100%;
    max-width: 430px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #15202b 0%, #0f1419 100%);
    position: relative;
  }
  header {
    padding: 10px 14px 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #7dd3fc;
    text-align: center;
  }
  #hud {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    font-size: 0.78rem;
  }
  .stat {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat .label { color: #94a3b8; font-size: 0.65rem; text-transform: uppercase; }
  .stat .val { font-weight: 700; font-size: 1rem; margin-top: 2px; }
  #gold .val { color: #fbbf24; }
  #lives .val { color: #f87171; }
  #wave .val { color: #a78bfa; }
  #sel .val { color: #34d399; font-size: 0.85rem; }

  #canvas-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 4px 8px;
    position: relative;
  }
  canvas {
    width: 100%;
    max-width: 414px;
    height: auto;
    border-radius: 14px;
    background: #0b1220;
    border: 2px solid #1e3a5f;
    display: block;
    touch-action: none;
  }

  #controls {
    padding: 10px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #tower-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tower-btn {
    appearance: none;
    border: 2px solid #334155;
    background: #1e293b;
    color: #e8eef4;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 56px;
    transition: transform 0.08s, border-color 0.15s, background 0.15s;
  }
  .tower-btn:active { transform: scale(0.97); }
  .tower-btn.selected {
    border-color: #38bdf8;
    background: #0c4a6e;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
  }
  .tower-btn .cost { display: block; font-size: 0.75rem; font-weight: 600; color: #fbbf24; margin-top: 4px; }
  .tower-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #start-btn {
    appearance: none;
    width: 100%;
    border: none;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color: #052e16;
    font-weight: 800;
    font-size: 1.1rem;
    border-radius: 14px;
    padding: 16px;
    min-height: 56px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  #start-btn:active { transform: scale(0.98); }
  #start-btn:disabled {
    background: #334155;
    color: #94a3b8;
    cursor: default;
  }
  #tower-actions {
    display: none;
    grid-template-columns: 1.4fr 1fr;
    gap: 10px;
  }
  #tower-actions.show { display: grid; }
  .action-btn {
    appearance: none;
    border: 2px solid #334155;
    background: #1e293b;
    color: #e8eef4;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    transition: transform 0.08s, border-color 0.15s, background 0.15s;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #btn-upgrade {
    border-color: #a78bfa;
    background: #3b0764;
    color: #e9d5ff;
  }
  #btn-upgrade .cost { display: block; font-size: 0.75rem; font-weight: 600; color: #fbbf24; margin-top: 4px; }
  #btn-sell {
    border-color: #64748b;
    background: #334155;
    color: #e2e8f0;
  }
  #btn-sell .cost { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-top: 4px; }
  #hint {
    text-align: center;
    font-size: 0.75rem;
    color: #64748b;
    min-height: 1.2em;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 20, 25, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    padding: 24px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 1.8rem; }
  #overlay p { color: #94a3b8; font-size: 0.95rem; max-width: 280px; }
  #overlay .win { color: #4ade80; }
  #overlay .lose { color: #f87171; }
  #restart-btn {
    appearance: none;
    border: none;
    background: #38bdf8;
    color: #0c4a6e;
    font-weight: 800;
    font-size: 1.05rem;
    border-radius: 14px;
    padding: 14px 36px;
    min-height: 52px;
    cursor: pointer;
  }

  .flash-gold { animation: flashGold 0.35s ease; }
  @keyframes flashGold {
    0% { background: #854d0e; }
    100% { background: #1e293b; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PATH GUARD</h1>
    <div id="hud">
      <div class="stat" id="gold"><div class="label">Gold</div><div class="val">50</div></div>
      <div class="stat" id="lives"><div class="label">Lives</div><div class="val">8</div></div>
      <div class="stat" id="wave"><div class="label">Wave</div><div class="val">0/5</div></div>
      <div class="stat" id="sel"><div class="label">Selected</div><div class="val">—</div></div>
    </div>
  </header>

  <div id="canvas-wrap">
    <canvas id="c" width="400" height="560"></canvas>
    <div id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-msg"></p>
      <button type="button" id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="controls">
    <div id="tower-btns">
      <button type="button" class="tower-btn" id="btn-archer" data-type="archer">
        🏹 Archer
        <span class="cost">50 gold</span>
      </button>
      <button type="button" class="tower-btn" id="btn-cannon" data-type="cannon">
        💣 Cannon
        <span class="cost">90 gold</span>
      </button>
    </div>
    <div id="tower-actions">
      <button type="button" class="action-btn" id="btn-upgrade">
        ⬆ Upgrade
        <span class="cost" id="upgrade-cost">—</span>
      </button>
      <button type="button" class="action-btn" id="btn-sell">
        Sell
        <span class="cost" id="sell-value">—</span>
      </button>
    </div>
    <button type="button" id="start-btn">Start Waves</button>
    <div id="hint">Tap pads to build, tap towers to upgrade</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Winding path waypoints (normalized to canvas)
  const PATH = [
    { x: 40, y: 40 },
    { x: 200, y: 40 },
    { x: 360, y: 40 },
    { x: 360, y: 140 },
    { x: 200, y: 140 },
    { x: 80, y: 140 },
    { x: 80, y: 260 },
    { x: 200, y: 260 },
    { x: 320, y: 260 },
    { x: 320, y: 380 },
    { x: 180, y: 380 },
    { x: 60, y: 380 },
    { x: 60, y: 500 },
    { x: 200, y: 500 },
    { x: 360, y: 500 },
  ];

  // Build pads near path bends / open sides
  const PADS = [
    { x: 140, y: 90 },
    { x: 280, y: 90 },
    { x: 280, y: 200 },
    { x: 140, y: 200 },
    { x: 140, y: 320 },
    { x: 260, y: 320 },
    { x: 120, y: 440 },
    { x: 280, y: 440 },
    { x: 200, y: 80 },
    { x: 200, y: 320 },
  ];

  const TOWER_DEFS = {
    archer: {
      name: 'Archer', cost: 50, range: 95, fireRate: 0.55, damage: 12,
      color: '#34d399', projectileSpeed: 420, projectileColor: '#a7f3d0',
      upgradeCosts: [40, 70],
    },
    cannon: {
      name: 'Cannon', cost: 90, range: 80, fireRate: 1.15, damage: 38,
      color: '#fb923c', projectileSpeed: 280, projectileColor: '#fdba74',
      upgradeCosts: [60, 100],
    },
  };

  const MAX_TOWER_LEVEL = 3;
  const LEVEL_RING = ['#34d399', '#fbbf24', '#c084fc'];

  const state = {
    gold: 50,
    lives: 8,
    wave: 0,
    maxWaves: 5,
    selected: null,
    selectedTower: null,
    towers: [],
    enemies: [],
    projectiles: [],
    particles: [],
    floatingTexts: [],
    started: false,
    gameOver: false,
    won: false,
    waveTimer: 0,
    spawnLeft: 0,
    spawnCD: 0,
    betweenWaves: false,
    nextWaveIn: 0,
  };

  const el = {
    gold: document.querySelector('#gold .val'),
    lives: document.querySelector('#lives .val'),
    wave: document.querySelector('#wave .val'),
    sel: document.querySelector('#sel .val'),
    hint: document.getElementById('hint'),
    start: document.getElementById('start-btn'),
    overlay: document.getElementById('overlay'),
    overlayTitle: document.getElementById('overlay-title'),
    overlayMsg: document.getElementById('overlay-msg'),
    goldStat: document.getElementById('gold'),
    towerActions: document.getElementById('tower-actions'),
    btnUpgrade: document.getElementById('btn-upgrade'),
    btnSell: document.getElementById('btn-sell'),
    upgradeCost: document.getElementById('upgrade-cost'),
    sellValue: document.getElementById('sell-value'),
  };

  function towerStats(tw) {
    const def = TOWER_DEFS[tw.type];
    const lv = tw.level || 1;
    const dmgMul = 1 + (lv - 1) * 0.4;
    const rateMul = 1 - (lv - 1) * 0.1;
    const rangeMul = 1 + (lv - 1) * 0.08;
    return {
      name: def.name,
      damage: Math.round(def.damage * dmgMul),
      fireRate: def.fireRate * rateMul,
      range: def.range * rangeMul,
      projectileSpeed: def.projectileSpeed,
      projectileColor: def.projectileColor,
      color: def.color,
    };
  }

  function upgradeCostFor(tw) {
    if (!tw || (tw.level || 1) >= MAX_TOWER_LEVEL) return null;
    const costs = TOWER_DEFS[tw.type].upgradeCosts;
    return costs[(tw.level || 1) - 1];
  }

  function sellValueFor(tw) {
    if (!tw) return 0;
    const def = TOWER_DEFS[tw.type];
    let invested = def.cost;
    const lv = tw.level || 1;
    for (let i = 0; i < lv - 1; i++) invested += def.upgradeCosts[i];
    return Math.floor(invested * 0.5);
  }

  function clearTowerSelection() {
    state.selectedTower = null;
  }

  function selectTower(tw) {
    state.selected = null;
    state.selectedTower = tw;
    const st = towerStats(tw);
    el.hint.textContent = `${st.name} Lv${tw.level} — dmg ${st.damage}, range ${Math.round(st.range)}`;
  }

  function pathLength() {
    let len = 0;
    for (let i = 1; i < PATH.length; i++) {
      const a = PATH[i - 1], b = PATH[i];
      len += Math.hypot(b.x - a.x, b.y - a.y);
    }
    return len;
  }
  const PATH_LEN = pathLength();

  function posOnPath(dist) {
    let d = Math.max(0, Math.min(dist, PATH_LEN));
    for (let i = 1; i < PATH.length; i++) {
      const a = PATH[i - 1], b = PATH[i];
      const seg = Math.hypot(b.x - a.x, b.y - a.y);
      if (d <= seg) {
        const t = seg === 0 ? 0 : d / seg;
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
      d -= seg;
    }
    const last = PATH[PATH.length - 1];
    return { x: last.x, y: last.y };
  }

  function updateHUD() {
    el.gold.textContent = Math.floor(state.gold);
    el.lives.textContent = state.lives;
    el.wave.textContent = `${state.wave}/${state.maxWaves}`;
    if (state.selectedTower) {
      const tw = state.selectedTower;
      el.sel.textContent = `${TOWER_DEFS[tw.type].name} L${tw.level}`;
    } else if (state.selected) {
      el.sel.textContent = TOWER_DEFS[state.selected].name;
    } else {
      el.sel.textContent = '—';
    }
    document.getElementById('btn-archer').disabled = state.gold < TOWER_DEFS.archer.cost || state.gameOver;
    document.getElementById('btn-cannon').disabled = state.gold < TOWER_DEFS.cannon.cost || state.gameOver;
    document.querySelectorAll('.tower-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.type === state.selected);
    });

    const showActions = !!state.selectedTower && !state.gameOver;
    el.towerActions.classList.toggle('show', showActions);
    if (showActions) {
      const tw = state.selectedTower;
      const cost = upgradeCostFor(tw);
      const maxed = cost == null;
      el.btnUpgrade.disabled = maxed || state.gold < cost;
      el.upgradeCost.textContent = maxed ? 'MAX Lv3' : `${cost} gold → Lv${tw.level + 1}`;
      el.sellValue.textContent = `+${sellValueFor(tw)} gold`;
      el.btnSell.disabled = false;
    }
  }

  function flashGold() {
    el.goldStat.classList.remove('flash-gold');
    void el.goldStat.offsetWidth;
    el.goldStat.classList.add('flash-gold');
  }

  function addFloat(x, y, text, color) {
    state.floatingTexts.push({ x, y, text, color, life: 0.9, vy: -40 });
  }

  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.35,
        max: 0.7,
        color,
        r: 2 + Math.random() * 3,
      });
    }
  }

  function placeFeedback(x, y, ok) {
    burst(x, y, ok ? '#38bdf8' : '#f87171', ok ? 14 : 8);
    addFloat(x, y - 18, ok ? 'Built!' : 'Blocked', ok ? '#7dd3fc' : '#fca5a5');
  }

  function getPadAt(mx, my) {
    const R = 28;
    for (let i = 0; i < PADS.length; i++) {
      const p = PADS[i];
      if (Math.hypot(mx - p.x, my - p.y) <= R) return i;
    }
    return -1;
  }

  function isPadOccupied(idx) {
    return state.towers.some(t => t.pad === idx);
  }

  function getTowerAt(mx, my) {
    const R = 22;
    for (let i = state.towers.length - 1; i >= 0; i--) {
      const t = state.towers[i];
      if (Math.hypot(mx - t.x, my - t.y) <= R) return t;
    }
    return null;
  }

  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
    const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY,
    };
  }

  function tryPlace(mx, my) {
    if (state.gameOver) return;

    // Building mode: place on empty pads
    if (state.selected) {
      const idx = getPadAt(mx, my);
      if (idx < 0) {
        el.hint.textContent = 'Tap a glowing pad to build';
        return;
      }
      if (isPadOccupied(idx)) {
        const occ = state.towers.find(t => t.pad === idx);
        if (occ) {
          // occupied while building — ignore upgrade select; keep build mode
          el.hint.textContent = 'Pad already occupied';
          placeFeedback(PADS[idx].x, PADS[idx].y, false);
        }
        return;
      }
      const def = TOWER_DEFS[state.selected];
      if (state.gold < def.cost) {
        el.hint.textContent = 'Not enough gold';
        placeFeedback(PADS[idx].x, PADS[idx].y, false);
        return;
      }
      state.gold -= def.cost;
      flashGold();
      const pad = PADS[idx];
      state.towers.push({
        pad: idx,
        x: pad.x,
        y: pad.y,
        type: state.selected,
        level: 1,
        cd: 0,
        pulse: 0.4,
      });
      placeFeedback(pad.x, pad.y, true);
      el.hint.textContent = `${def.name} placed! Tap towers to upgrade.`;
      updateHUD();
      return;
    }

    // No build type: select tower or deselect
    const hit = getTowerAt(mx, my);
    if (hit) {
      selectTower(hit);
      updateHUD();
      return;
    }
    if (state.selectedTower) {
      clearTowerSelection();
      el.hint.textContent = 'Tap pads to build, tap towers to upgrade';
      updateHUD();
    }
  }

  function upgradeSelectedTower() {
    const tw = state.selectedTower;
    if (!tw || state.gameOver) return;
    const cost = upgradeCostFor(tw);
    if (cost == null) {
      el.hint.textContent = 'Already max level (3)';
      return;
    }
    if (state.gold < cost) {
      el.hint.textContent = 'Not enough gold to upgrade';
      flashGold();
      return;
    }
    state.gold -= cost;
    flashGold();
    tw.level = (tw.level || 1) + 1;
    tw.pulse = 0.45;
    burst(tw.x, tw.y, LEVEL_RING[tw.level - 1], 16);
    addFloat(tw.x, tw.y - 20, `Lv${tw.level}!`, LEVEL_RING[tw.level - 1]);
    selectTower(tw);
    updateHUD();
  }

  function sellSelectedTower() {
    const tw = state.selectedTower;
    if (!tw || state.gameOver) return;
    const value = sellValueFor(tw);
    state.gold += value;
    flashGold();
    burst(tw.x, tw.y, '#94a3b8', 12);
    addFloat(tw.x, tw.y - 18, `+${value}`, '#fde68a');
    const idx = state.towers.indexOf(tw);
    if (idx >= 0) state.towers.splice(idx, 1);
    clearTowerSelection();
    el.hint.textContent = `Sold for ${value} gold`;
    updateHUD();
  }

  function waveEnemyCount(w) {
    return 4 + w * 3;
  }
  function waveSpeed(w) {
    return 55 + w * 12;
  }
  function waveHP(w) {
    return 28 + w * 18;
  }
  function waveReward(w) {
    return 8 + w * 2;
  }

  function startNextWave() {
    if (state.wave >= state.maxWaves) return;
    state.wave++;
    state.spawnLeft = waveEnemyCount(state.wave);
    state.spawnCD = 0.4;
    state.betweenWaves = false;
    el.hint.textContent = `Wave ${state.wave} incoming!`;
    updateHUD();
  }

  function spawnEnemy() {
    const w = state.wave;
    state.enemies.push({
      dist: 0,
      speed: waveSpeed(w) * (0.9 + Math.random() * 0.2),
      hp: waveHP(w),
      maxHp: waveHP(w),
      reward: waveReward(w),
      r: 12,
      hitFlash: 0,
    });
  }

  function endGame(won) {
    state.gameOver = true;
    state.won = won;
    state.selected = null;
    state.selectedTower = null;
    el.start.disabled = true;
    el.overlay.classList.add('show');
    if (won) {
      el.overlayTitle.className = 'win';
      el.overlayTitle.textContent = 'Victory!';
      el.overlayMsg.textContent = `You held the path through ${state.maxWaves} waves. Gold left: ${Math.floor(state.gold)}.`;
    } else {
      el.overlayTitle.className = 'lose';
      el.overlayTitle.textContent = 'Path Breached';
      el.overlayMsg.textContent = `8 enemies escaped. You reached wave ${state.wave}. Try a Cannon near the bends!`;
    }
    updateHUD();
  }

  function resetGame() {
    state.gold = 50;
    state.lives = 8;
    state.wave = 0;
    state.selected = null;
    state.selectedTower = null;
    state.towers = [];
    state.enemies = [];
    state.projectiles = [];
    state.particles = [];
    state.floatingTexts = [];
    state.started = false;
    state.gameOver = false;
    state.won = false;
    state.spawnLeft = 0;
    state.spawnCD = 0;
    state.betweenWaves = false;
    state.nextWaveIn = 0;
    el.overlay.classList.remove('show');
    el.start.disabled = false;
    el.start.textContent = 'Start Waves';
    el.hint.textContent = 'Tap pads to build, tap towers to upgrade';
    updateHUD();
  }

  // Input — pointer events
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const { x, y } = canvasCoords(e);
    tryPlace(x, y);
  });

  document.querySelectorAll('.tower-btn').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (btn.disabled || state.gameOver) return;
      const type = btn.dataset.type;
      clearTowerSelection();
      state.selected = state.selected === type ? null : type;
      el.hint.textContent = state.selected
        ? `Selected ${TOWER_DEFS[type].name} — tap a pad`
        : 'Tap pads to build, tap towers to upgrade';
      updateHUD();
    });
  });

  el.btnUpgrade.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    upgradeSelectedTower();
  });

  el.btnSell.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sellSelectedTower();
  });

  el.start.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.gameOver || state.started) return;
    state.started = true;
    el.start.disabled = true;
    el.start.textContent = 'Waves Active';
    startNextWave();
  });

  document.getElementById('restart-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resetGame();
  });

  function findTarget(tower) {
    const st = towerStats(tower);
    let best = null;
    let bestDist = -1;
    for (const en of state.enemies) {
      const p = posOnPath(en.dist);
      const d = Math.hypot(p.x - tower.x, p.y - tower.y);
      if (d <= st.range && en.dist > bestDist) {
        bestDist = en.dist;
        best = en;
      }
    }
    return best;
  }

  function update(dt) {
    if (state.gameOver) {
      // still animate particles / floats
    } else if (state.started) {
      // spawning
      if (state.spawnLeft > 0) {
        state.spawnCD -= dt;
        if (state.spawnCD <= 0) {
          spawnEnemy();
          state.spawnLeft--;
          state.spawnCD = Math.max(0.35, 0.85 - state.wave * 0.08);
        }
      } else if (state.enemies.length === 0 && !state.betweenWaves) {
        if (state.wave >= state.maxWaves) {
          endGame(true);
        } else {
          state.betweenWaves = true;
          state.nextWaveIn = 2.2;
          el.hint.textContent = `Wave ${state.wave} cleared! Next wave soon…`;
        }
      }

      if (state.betweenWaves) {
        state.nextWaveIn -= dt;
        if (state.nextWaveIn <= 0) startNextWave();
      }

      // enemies
      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const en = state.enemies[i];
        en.dist += en.speed * dt;
        if (en.hitFlash > 0) en.hitFlash -= dt;
        if (en.dist >= PATH_LEN) {
          state.enemies.splice(i, 1);
          state.lives--;
          burst(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y, '#f87171', 12);
          addFloat(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y - 20, '-1 life', '#fca5a5');
          updateHUD();
          if (state.lives <= 0) endGame(false);
        }
      }

      // towers fire
      for (const tw of state.towers) {
        const st = towerStats(tw);
        if (tw.pulse > 0) tw.pulse -= dt;
        tw.cd -= dt;
        if (tw.cd <= 0) {
          const tgt = findTarget(tw);
          if (tgt) {
            // lead slightly
            const lead = Math.min(40, tgt.speed * 0.15);
            const aim = posOnPath(Math.min(PATH_LEN, tgt.dist + lead));
            state.projectiles.push({
              x: tw.x, y: tw.y,
              tx: aim.x, ty: aim.y,
              speed: st.projectileSpeed,
              damage: st.damage,
              color: st.projectileColor,
              target: tgt,
              type: tw.type,
            });
            tw.cd = st.fireRate;
            tw.pulse = 0.15;
          }
        }
      }

      // projectiles
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const pr = state.projectiles[i];
        let aimX = pr.tx, aimY = pr.ty;
        if (pr.target && state.enemies.includes(pr.target)) {
          const p = posOnPath(pr.target.dist);
          aimX = p.x; aimY = p.y;
        }
        const dx = aimX - pr.x, dy = aimY - pr.y;
        const dist = Math.hypot(dx, dy);
        const step = pr.speed * dt;
        if (dist <= step || dist < 8) {
          // hit
          const en = pr.target;
          if (en && state.enemies.includes(en)) {
            en.hp -= pr.damage;
            en.hitFlash = 0.12;
            burst(en.x ?? posOnPath(en.dist).x, (en.y ?? posOnPath(en.dist).y), pr.color, pr.type === 'cannon' ? 16 : 8);
            if (en.hp <= 0) {
              const p = posOnPath(en.dist);
              state.gold += en.reward;
              flashGold();
              burst(p.x, p.y, '#fbbf24', 18);
              addFloat(p.x, p.y - 16, `+${en.reward}`, '#fde68a');
              const idx = state.enemies.indexOf(en);
              if (idx >= 0) state.enemies.splice(idx, 1);
              updateHUD();
            }
          } else {
            burst(pr.x, pr.y, pr.color, 4);
          }
          state.projectiles.splice(i, 1);
        } else {
          pr.x += (dx / dist) * step;
          pr.y += (dy / dist) * step;
        }
      }
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const f = state.floatingTexts[i];
      f.life -= dt;
      f.y += f.vy * dt;
      if (f.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  function drawPath() {
    // grass-ish bg accents
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    // soft tiles
    for (let y = 0; y < H; y += 40) {
      for (let x = 0; x < W; x += 40) {
        if ((x / 40 + y / 40) % 2 === 0) {
          ctx.fillStyle = 'rgba(30, 58, 95, 0.15)';
          ctx.fillRect(x, y, 40, 40);
        }
      }
    }

    // path glow
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    // path body
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 26;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    // start / end markers
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(PATH[0].x, PATH[0].y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPads() {
    const t = performance.now() / 1000;
    for (let i = 0; i < PADS.length; i++) {
      const p = PADS[i];
      const occ = isPadOccupied(i);
      const highlight = state.selected && !occ && !state.gameOver;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
      if (occ) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.strokeStyle = '#475569';
      } else if (highlight) {
        const pulse = 0.55 + Math.sin(t * 4) * 0.25;
        ctx.fillStyle = `rgba(56, 189, 248, ${0.15 + pulse * 0.15})`;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      if (!occ) {
        ctx.fillStyle = highlight ? '#7dd3fc' : '#64748b';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', p.x, p.y + 1);
      }
    }
  }

  function drawTowers() {
    for (const tw of state.towers) {
      const def = TOWER_DEFS[tw.type];
      const st = towerStats(tw);
      const lv = tw.level || 1;
      const ringColor = LEVEL_RING[Math.min(lv, MAX_TOWER_LEVEL) - 1];
      const isSel = state.selectedTower === tw;
      // range ring when this tower is selected, or faint when build-type matches
      if (isSel || state.selected === tw.type) {
        ctx.beginPath();
        ctx.arc(tw.x, tw.y, st.range, 0, Math.PI * 2);
        ctx.strokeStyle = isSel ? 'rgba(192, 132, 252, 0.45)' : 'rgba(148, 163, 184, 0.25)';
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.stroke();
      }
      const levelBump = 1 + (lv - 1) * 0.08;
      const scale = levelBump * (1 + (tw.pulse > 0 ? tw.pulse * 0.35 : 0));
      ctx.save();
      ctx.translate(tw.x, tw.y);
      ctx.scale(scale, scale);
      // selection halo
      if (isSel) {
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(192, 132, 252, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      // base
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = 3 + (lv - 1) * 0.5;
      ctx.stroke();
      // icon body
      if (tw.type === 'archer') {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(8, 8);
        ctx.lineTo(-8, 8);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-3, -10, 6, 8);
      }
      ctx.restore();
      // level badge
      ctx.beginPath();
      ctx.arc(tw.x + 12, tw.y - 12, 8, 0, Math.PI * 2);
      ctx.fillStyle = ringColor;
      ctx.fill();
      ctx.fillStyle = '#0f1419';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(lv), tw.x + 12, tw.y - 11);
    }
  }

  function drawEnemies() {
    for (const en of state.enemies) {
      const p = posOnPath(en.dist);
      en.x = p.x; en.y = p.y;
      ctx.beginPath();
      ctx.arc(p.x, p.y, en.r, 0, Math.PI * 2);
      ctx.fillStyle = en.hitFlash > 0 ? '#fecaca' : '#ef4444';
      ctx.fill();
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 2;
      ctx.stroke();
      // HP bar
      const bw = 22, bh = 4;
      const ratio = Math.max(0, en.hp / en.maxHp);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(p.x - bw / 2, p.y - en.r - 10, bw, bh);
      ctx.fillStyle = ratio > 0.4 ? '#4ade80' : '#f87171';
      ctx.fillRect(p.x - bw / 2, p.y - en.r - 10, bw * ratio, bh);
    }
  }

  function drawProjectiles() {
    for (const pr of state.projectiles) {
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, pr.type === 'cannon' ? 6 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = pr.color;
      ctx.shadowColor = pr.color;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const f of state.floatingTexts) {
      ctx.globalAlpha = Math.max(0, f.life / 0.9);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    drawPath();
    drawPads();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawParticles();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  updateHUD();
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) req.call(el).catch(() => {});
  // iOS / Android: prefer Add to Home Screen for true chrome-less mode
}
</script>
</body>
</html>
