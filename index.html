<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Path Guard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Path Guard</title>
<!-- path-guard-build: 12 -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: #0f1419;
    color: #e8eef4;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #app {
    width: 100%;
    max-width: 430px;
    height: 100%;
    height: 100dvh;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #15202b 0%, #0f1419 100%);
    position: relative;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (display-mode: standalone), (display-mode: fullscreen) {
    body { background: #0f1419; }
    #app { border-radius: 0; }
    canvas { border-radius: 0; border-left: none; border-right: none; }
  }

  header {
    flex-shrink: 0;
    padding: 4px 10px 2px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  h1 {
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #7dd3fc;
    text-align: center;
  }
  #hud {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 5px;
    font-size: 0.74rem;
  }
  .stat {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 9px;
    padding: 6px 4px;
    text-align: center;
  }
  .stat .label { color: #94a3b8; font-size: 0.6rem; text-transform: uppercase; }
  .stat .val { font-weight: 700; font-size: 0.92rem; margin-top: 1px; }
  #gold .val { color: #fbbf24; }
  #lives .val { color: #f87171; }
  #wave .val { color: #a78bfa; }
  #sel .val { color: #34d399; font-size: 0.78rem; }
  #best-line {
    text-align: center;
    font-size: 0.62rem;
    color: #64748b;
    min-height: 0.9em;
  }

  #canvas-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    position: relative;
  }
  canvas {
    width: auto;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 400 / 560;
    border-radius: 12px;
    background: #0b1220;
    border: 2px solid #1e3a5f;
    display: block;
    touch-action: none;
  }

  #controls {
    flex-shrink: 0;
    padding: 4px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #tower-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .tower-btn {
    appearance: none;
    border: 2px solid #334155;
    background: #1e293b;
    color: #e8eef4;
    border-radius: 10px;
    padding: 6px 4px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    transition: transform 0.08s, border-color 0.15s, background 0.15s;
  }
  .tower-btn:active { transform: scale(0.97); }
  .tower-btn.selected {
    border-color: #38bdf8;
    background: #0c4a6e;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
  }
  .tower-btn .cost { display: block; font-size: 0.62rem; font-weight: 600; color: #fbbf24; margin-top: 1px; }
  .tower-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #btn-frost.selected { border-color: #67e8f9; background: #164e63; }
  #btn-zap.selected { border-color: #c084fc; background: #3b0764; }

  #util-btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .util-btn {
    appearance: none;
    border: 1px solid #334155;
    background: #1e293b;
    color: #cbd5e1;
    border-radius: 8px;
    padding: 5px 6px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 32px;
  }
  .util-btn:active { transform: scale(0.97); }
  .util-btn.active {
    border-color: #38bdf8;
    color: #7dd3fc;
    background: #0c4a6e;
  }

  #wave-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .wave-btn {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    min-height: 42px;
    letter-spacing: 0.02em;
  }
  .wave-btn:active { transform: scale(0.97); }
  .wave-btn:disabled {
    opacity: 0.45;
    cursor: default;
    transform: none;
  }
  #btn-next-wave {
    background: linear-gradient(180deg, #a78bfa, #7c3aed);
    color: #f5f3ff;
  }
  #btn-continuous {
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color: #052e16;
  }
  #tower-btns.hidden { display: none; }
  #tower-actions {
    display: none;
    grid-template-columns: 1.4fr 1fr;
    gap: 6px;
  }
  #tower-actions.show { display: grid; }
  #sell-confirm {
    display: none;
    grid-template-columns: 1.4fr 1fr;
    gap: 6px;
  }
  #sell-confirm.show { display: grid; }
  #btn-sell-yes {
    border-color: #f87171;
    background: #7f1d1d;
    color: #fecaca;
  }
  #btn-sell-yes .cost { display: block; font-size: 0.62rem; font-weight: 600; color: #fde68a; margin-top: 1px; }
  #btn-sell-no {
    border-color: #64748b;
    background: #334155;
    color: #e2e8f0;
  }
  .action-btn {
    appearance: none;
    border: 2px solid #334155;
    background: #1e293b;
    color: #e8eef4;
    border-radius: 10px;
    padding: 8px 6px;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    min-height: 40px;
    transition: transform 0.08s, border-color 0.15s, background 0.15s;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #btn-upgrade {
    border-color: #a78bfa;
    background: #3b0764;
    color: #e9d5ff;
  }
  #btn-upgrade .cost { display: block; font-size: 0.62rem; font-weight: 600; color: #fbbf24; margin-top: 1px; }
  #btn-sell {
    border-color: #64748b;
    background: #334155;
    color: #e2e8f0;
  }
  #btn-sell .cost { display: block; font-size: 0.62rem; font-weight: 600; color: #94a3b8; margin-top: 1px; }
  #hint {
    text-align: center;
    font-size: 0.65rem;
    color: #64748b;
    min-height: 1em;
  }
  #build-ver { text-align: center; font-size: 10px; opacity: 0.45; }

  #overlay, #map-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 20, 25, 0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 20;
    padding: 20px;
    text-align: center;
  }
  #overlay.show, #map-overlay.show { display: flex; }
  #map-overlay { gap: 8px; padding: 12px 14px; }
  #map-overlay h2 { font-size: 1.35rem; }
  #overlay h2 { font-size: 1.6rem; }
  #overlay p, #map-overlay p { color: #94a3b8; font-size: 0.85rem; max-width: 280px; }
  #map-overlay p { margin-bottom: 2px; }
  #overlay .win { color: #4ade80; }
  #overlay .lose { color: #f87171; }
  #overlay .rating { color: #fbbf24; font-size: 1.15rem; font-weight: 800; }
  #restart-btn, .map-pick-btn {
    appearance: none;
    border: none;
    background: #38bdf8;
    color: #0c4a6e;
    font-weight: 800;
    font-size: 1rem;
    border-radius: 12px;
    padding: 12px 28px;
    min-height: 48px;
    cursor: pointer;
  }
  .map-pick-btn {
    width: min(280px, 90%);
    background: #1e293b;
    color: #e8eef4;
    border: 2px solid #38bdf8;
    display: flex;
    flex-direction: column;
    gap: 1px;
    align-items: center;
    padding: 8px 14px;
    min-height: 40px;
    font-size: 0.9rem;
    border-radius: 10px;
  }
  .map-pick-btn .sub { font-size: 0.68rem; font-weight: 600; color: #94a3b8; }
  .map-pick-btn:active { transform: scale(0.97); }
  .map-pick-btn.last { border-color: #fbbf24; box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2); }

  .flash-gold { animation: flashGold 0.35s ease; }
  @keyframes flashGold {
    0% { background: #854d0e; }
    100% { background: #1e293b; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PATH GUARD</h1>
    <div id="hud">
      <div class="stat" id="gold"><div class="label">Gold</div><div class="val">70</div></div>
      <div class="stat" id="lives"><div class="label">Lives</div><div class="val">8</div></div>
      <div class="stat" id="wave"><div class="label">Wave</div><div class="val">0/20</div></div>
      <div class="stat" id="sel"><div class="label">Selected</div><div class="val">—</div></div>
    </div>
    <div id="best-line"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="c" width="400" height="560"></canvas>
    <div id="map-overlay" class="show">
      <h2>Choose Map</h2>
      <p>Pick a path, then build towers and hold the line.</p>
      <button type="button" class="map-pick-btn" id="map-serpentine" data-map="serpentine">
        Map 1: Serpentine — Easy
        <span class="sub">Wide S-lanes, many pads</span>
      </button>
      <button type="button" class="map-pick-btn" id="map-winding" data-map="winding">
        Map 2: Winding — Medium
        <span class="sub">Classic switchback path</span>
      </button>
      <button type="button" class="map-pick-btn" id="map-gauntlet" data-map="gauntlet">
        Map 3: Gauntlet — Hard
        <span class="sub">Short path, awkward pads</span>
      </button>
      <button type="button" class="map-pick-btn" id="map-spiral" data-map="spiral">
        Map 4: Spiral — Brutal
        <span class="sub">Long coil, scarce pads</span>
      </button>
    </div>
    <div id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-rating" class="rating"></p>
      <p id="overlay-msg"></p>
      <button type="button" id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="controls">
    <div id="tower-btns">
      <button type="button" class="tower-btn" id="btn-archer" data-type="archer">
        🏹 Archer
        <span class="cost">50g</span>
      </button>
      <button type="button" class="tower-btn" id="btn-cannon" data-type="cannon">
        💣 Cannon
        <span class="cost">90g</span>
      </button>
      <button type="button" class="tower-btn" id="btn-frost" data-type="frost">
        ❄️ Frost
        <span class="cost">75g</span>
      </button>
      <button type="button" class="tower-btn" id="btn-zap" data-type="zap">
        ⚡ Zap
        <span class="cost">110g</span>
      </button>
    </div>
    <div id="tower-actions">
      <button type="button" class="action-btn" id="btn-upgrade">
        ⬆ Upgrade
        <span class="cost" id="upgrade-cost">—</span>
      </button>
      <button type="button" class="action-btn" id="btn-sell">
        Sell
        <span class="cost" id="sell-value">—</span>
      </button>
    </div>
    <div id="sell-confirm">
      <button type="button" class="action-btn" id="btn-sell-yes">
        Confirm Sell
        <span class="cost" id="sell-confirm-value">—</span>
      </button>
      <button type="button" class="action-btn" id="btn-sell-no">Cancel</button>
    </div>
    <div id="util-btns">
      <button type="button" class="util-btn" id="btn-speed">Speed 1x</button>
      <button type="button" class="util-btn" id="btn-pause">Pause</button>
      <button type="button" class="util-btn" id="btn-change-map" disabled>Change Map</button>
    </div>
    <div id="wave-btns">
      <button type="button" class="wave-btn" id="btn-next-wave">Next Wave</button>
      <button type="button" class="wave-btn" id="btn-continuous">Continuous Waves</button>
    </div>
    <div id="hint">Pick a map, build on pads, then press Next Wave</div>
    <div id="build-ver">build 12</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const START_GOLD = 70;
  const START_LIVES = 8;
  const MAX_WAVES = 20;
  const MAX_TOWER_LEVEL = 5;
  const LEVEL_RING = ['#34d399', '#fbbf24', '#c084fc', '#f472b6', '#38bdf8'];
  const LS_MAP = 'pg-last-map';
  const LS_BEST_WAVE = 'pg-best-wave';
  const LS_BEST_WIN = 'pg-best-win'; // lives remaining on best win

  const MAPS = {
    serpentine: {
      id: 'serpentine',
      name: 'Serpentine',
      spawnExtra: 0,
      hardenChance: 0,
      startGoldBonus: 10,
      // True horizontal S: alternating full-width lanes (distinct from Winding)
      path: [
        { x: 30, y: 40 },
        { x: 370, y: 40 },
        { x: 370, y: 130 },
        { x: 30, y: 130 },
        { x: 30, y: 220 },
        { x: 370, y: 220 },
        { x: 370, y: 310 },
        { x: 30, y: 310 },
        { x: 30, y: 400 },
        { x: 370, y: 400 },
        { x: 370, y: 490 },
        { x: 30, y: 490 },
        { x: 30, y: 540 },
      ],
      // Pads sit in bay centers between horizontals (≥28px from centerline)
      pads: [
        { x: 120, y: 85 },
        { x: 280, y: 85 },
        { x: 100, y: 175 },
        { x: 200, y: 175 },
        { x: 300, y: 175 },
        { x: 120, y: 265 },
        { x: 280, y: 265 },
        { x: 100, y: 355 },
        { x: 200, y: 355 },
        { x: 300, y: 355 },
        { x: 120, y: 445 },
        { x: 280, y: 445 },
      ],
    },
    winding: {
      id: 'winding',
      name: 'Winding',
      spawnExtra: 1,
      hardenChance: 0.12,
      startGoldBonus: 0,
      path: [
        { x: 40, y: 40 },
        { x: 200, y: 40 },
        { x: 360, y: 40 },
        { x: 360, y: 140 },
        { x: 200, y: 140 },
        { x: 80, y: 140 },
        { x: 80, y: 260 },
        { x: 200, y: 260 },
        { x: 320, y: 260 },
        { x: 320, y: 380 },
        { x: 180, y: 380 },
        { x: 60, y: 380 },
        { x: 60, y: 500 },
        { x: 200, y: 500 },
        { x: 360, y: 500 },
      ],
      pads: [
        { x: 140, y: 90 },
        { x: 280, y: 90 },
        { x: 280, y: 200 },
        { x: 140, y: 200 },
        { x: 140, y: 320 },
        { x: 260, y: 320 },
        { x: 120, y: 440 },
        { x: 280, y: 440 },
        { x: 200, y: 80 },
        { x: 200, y: 320 },
      ],
    },
    gauntlet: {
      id: 'gauntlet',
      name: 'Gauntlet',
      spawnExtra: 3,
      hardenChance: 0.32,
      startGoldBonus: 0,
      // Short 3-lane corridor — enemies reach the exit faster
      path: [
        { x: 50, y: 40 },
        { x: 350, y: 40 },
        { x: 350, y: 200 },
        { x: 50, y: 200 },
        { x: 50, y: 380 },
        { x: 350, y: 380 },
        { x: 350, y: 530 },
      ],
      // 8 pads in awkward bay spots (≥28px off centerline)
      pads: [
        { x: 100, y: 120 },
        { x: 180, y: 120 },
        { x: 280, y: 120 },
        { x: 120, y: 290 },
        { x: 220, y: 290 },
        { x: 300, y: 290 },
        { x: 150, y: 455 },
        { x: 250, y: 455 },
      ],
    },
    spiral: {
      id: 'spiral',
      name: 'Spiral',
      spawnExtra: 5,
      hardenChance: 0.5,
      startGoldBonus: 0,
      // Rectangular coil then center drop — long path, scarce pads
      path: [
        { x: 30, y: 30 },
        { x: 370, y: 30 },
        { x: 370, y: 530 },
        { x: 30, y: 530 },
        { x: 30, y: 90 },
        { x: 310, y: 90 },
        { x: 310, y: 470 },
        { x: 90, y: 470 },
        { x: 90, y: 150 },
        { x: 250, y: 150 },
        { x: 250, y: 410 },
        { x: 150, y: 410 },
        { x: 150, y: 250 },
        { x: 200, y: 250 },
        { x: 200, y: 545 },
      ],
      // 7 sparse ring-pocket pads (≥28px off centerline)
      pads: [
        { x: 200, y: 60 },
        { x: 60, y: 300 },
        { x: 340, y: 280 },
        { x: 100, y: 500 },
        { x: 300, y: 500 },
        { x: 120, y: 300 },
        { x: 200, y: 120 },
      ],
    },
  };

  const TOWER_DEFS = {
    archer: {
      name: 'Archer', cost: 50, range: 95, fireRate: 0.52, damage: 12,
      color: '#34d399', projectileSpeed: 420, projectileColor: '#a7f3d0',
      upgradeCosts: [40, 70, 110, 160],
    },
    cannon: {
      name: 'Cannon', cost: 90, range: 80, fireRate: 1.1, damage: 40,
      color: '#fb923c', projectileSpeed: 280, projectileColor: '#fdba74',
      upgradeCosts: [60, 100, 150, 210],
      splashRadius: 42, splashMul: 0.5,
    },
    frost: {
      name: 'Frost', cost: 75, range: 100, fireRate: 0.85, damage: 8,
      color: '#67e8f9', projectileSpeed: 360, projectileColor: '#a5f3fc',
      upgradeCosts: [50, 85, 130, 180],
      slowMul: 0.5, slowDur: 1.6,
    },
    zap: {
      name: 'Zap', cost: 110, range: 105, fireRate: 0.95, damage: 20,
      color: '#c084fc', projectileSpeed: 560, projectileColor: '#e9d5ff',
      upgradeCosts: [70, 115, 170, 240],
      multi: 3, multiFalloff: 0.7,
    },
  };

  // Fixed stats per type — never scale by wave or map
  const ENEMY_TYPES = {
    normal: { name: 'Grunt', r: 12, hp: 60, speed: 70, reward: 8, color: '#ef4444', stroke: '#7f1d1d' },
    fast:   { name: 'Scout', r: 8,  hp: 32, speed: 125, reward: 7, color: '#fbbf24', stroke: '#92400e' },
    tank:   { name: 'Brute', r: 17, hp: 180, speed: 38, reward: 14, color: '#a78bfa', stroke: '#4c1d95' },
  };

  let PATH = MAPS.serpentine.path;
  let PADS = MAPS.serpentine.pads;
  let PATH_LEN = 0;

  const state = {
    mapId: 'serpentine',
    mapPicked: false,
    gold: START_GOLD,
    lives: START_LIVES,
    wave: 0,
    maxWaves: MAX_WAVES,
    selected: null,
    selectedTower: null,
    towers: [],
    enemies: [],
    projectiles: [],
    particles: [],
    floatingTexts: [],
    bolts: [],
    rings: [],
    changingMap: false,
    started: false,
    gameOver: false,
    won: false,
    waveTimer: 0,
    spawnLeft: 0,
    spawnQueue: [],
    spawnCD: 0,
    betweenWaves: false,
    nextWaveIn: 0,
    waveMode: 'next',
    awaitingNextWave: false,
    sellConfirming: false,
    gameSpeed: 1,
    paused: false,
  };

  const el = {
    gold: document.querySelector('#gold .val'),
    lives: document.querySelector('#lives .val'),
    wave: document.querySelector('#wave .val'),
    sel: document.querySelector('#sel .val'),
    hint: document.getElementById('hint'),
    bestLine: document.getElementById('best-line'),
    btnNextWave: document.getElementById('btn-next-wave'),
    btnContinuous: document.getElementById('btn-continuous'),
    btnSpeed: document.getElementById('btn-speed'),
    btnPause: document.getElementById('btn-pause'),
    btnChangeMap: document.getElementById('btn-change-map'),
    overlay: document.getElementById('overlay'),
    mapOverlay: document.getElementById('map-overlay'),
    overlayTitle: document.getElementById('overlay-title'),
    overlayRating: document.getElementById('overlay-rating'),
    overlayMsg: document.getElementById('overlay-msg'),
    goldStat: document.getElementById('gold'),
    towerBtns: document.getElementById('tower-btns'),
    towerActions: document.getElementById('tower-actions'),
    sellConfirm: document.getElementById('sell-confirm'),
    btnUpgrade: document.getElementById('btn-upgrade'),
    btnSell: document.getElementById('btn-sell'),
    btnSellYes: document.getElementById('btn-sell-yes'),
    btnSellNo: document.getElementById('btn-sell-no'),
    upgradeCost: document.getElementById('upgrade-cost'),
    sellValue: document.getElementById('sell-value'),
    sellConfirmValue: document.getElementById('sell-confirm-value'),
  };

  function pathLength(path) {
    let len = 0;
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      len += Math.hypot(b.x - a.x, b.y - a.y);
    }
    return len;
  }

  function applyMap(mapId) {
    const map = MAPS[mapId] || MAPS.serpentine;
    state.mapId = map.id;
    PATH = map.path;
    PADS = map.pads;
    PATH_LEN = pathLength(PATH);
    try { localStorage.setItem(LS_MAP, map.id); } catch (_) {}
  }

  function activeMap() {
    return MAPS[state.mapId] || MAPS.serpentine;
  }

  function startGoldForMap(mapId) {
    const map = MAPS[mapId] || MAPS.serpentine;
    return START_GOLD + (map.startGoldBonus || 0);
  }

  function loadBest() {
    let bestWave = 0, bestWin = 0;
    try {
      bestWave = parseInt(localStorage.getItem(LS_BEST_WAVE) || '0', 10) || 0;
      bestWin = parseInt(localStorage.getItem(LS_BEST_WIN) || '0', 10) || 0;
    } catch (_) {}
    return { bestWave, bestWin };
  }

  function saveBestWave(w) {
    try {
      const cur = parseInt(localStorage.getItem(LS_BEST_WAVE) || '0', 10) || 0;
      if (w > cur) localStorage.setItem(LS_BEST_WAVE, String(w));
    } catch (_) {}
  }

  function saveBestWin(livesLeft) {
    try {
      const cur = parseInt(localStorage.getItem(LS_BEST_WIN) || '0', 10) || 0;
      if (livesLeft > cur) localStorage.setItem(LS_BEST_WIN, String(livesLeft));
    } catch (_) {}
  }

  function refreshBestLine() {
    const { bestWave, bestWin } = loadBest();
    if (bestWave <= 0 && bestWin <= 0) {
      el.bestLine.textContent = '';
      return;
    }
    const parts = [];
    if (bestWave > 0) parts.push(`Best wave ${bestWave}`);
    if (bestWin > 0) parts.push(`Best win ${bestWin}♥`);
    el.bestLine.textContent = parts.join(' · ');
  }

  function towerStats(tw) {
    const def = TOWER_DEFS[tw.type];
    const lv = tw.level || 1;
    const dmgMul = 1 + (lv - 1) * 0.38;
    const rateMul = 1 - (lv - 1) * 0.08;
    const rangeMul = 1 + (lv - 1) * 0.07;
    return {
      name: def.name,
      damage: Math.round(def.damage * dmgMul),
      fireRate: Math.max(0.22, def.fireRate * rateMul),
      range: def.range * rangeMul,
      projectileSpeed: def.projectileSpeed,
      projectileColor: def.projectileColor,
      color: def.color,
      slowMul: def.slowMul,
      slowDur: def.slowDur ? def.slowDur + (lv - 1) * 0.2 : 0,
      multi: def.multi ? Math.min(5, def.multi + Math.floor((lv - 1) / 2)) : 0,
      multiFalloff: def.multiFalloff || 0.7,
      splashRadius: def.splashRadius ? def.splashRadius + (lv - 1) * 3.25 : 0,
      splashMul: def.splashMul != null ? Math.min(0.6, def.splashMul + (lv - 1) * 0.0375) : 0,
    };
  }

  function upgradeCostFor(tw) {
    if (!tw || (tw.level || 1) >= MAX_TOWER_LEVEL) return null;
    const costs = TOWER_DEFS[tw.type].upgradeCosts;
    return costs[(tw.level || 1) - 1];
  }

  function sellValueFor(tw) {
    if (!tw) return 0;
    const def = TOWER_DEFS[tw.type];
    let invested = def.cost;
    const lv = tw.level || 1;
    for (let i = 0; i < lv - 1; i++) invested += def.upgradeCosts[i];
    return Math.floor(invested * 0.5);
  }

  function clearTowerSelection() {
    state.selectedTower = null;
    state.sellConfirming = false;
  }

  function selectTower(tw) {
    state.selected = null;
    state.selectedTower = tw;
    state.sellConfirming = false;
    const st = towerStats(tw);
    el.hint.textContent = `${st.name} Lv${tw.level} — dmg ${st.damage}, range ${Math.round(st.range)}`;
  }

  function posOnPath(dist) {
    let d = Math.max(0, Math.min(dist, PATH_LEN));
    for (let i = 1; i < PATH.length; i++) {
      const a = PATH[i - 1], b = PATH[i];
      const seg = Math.hypot(b.x - a.x, b.y - a.y);
      if (d <= seg) {
        const t = seg === 0 ? 0 : d / seg;
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
      d -= seg;
    }
    const last = PATH[PATH.length - 1];
    return { x: last.x, y: last.y };
  }

  function updateHUD() {
    el.gold.textContent = Math.floor(state.gold);
    el.lives.textContent = state.lives;
    el.wave.textContent = `${state.wave}/${state.maxWaves}`;
    if (state.selectedTower) {
      const tw = state.selectedTower;
      el.sel.textContent = `${TOWER_DEFS[tw.type].name} L${tw.level}`;
    } else if (state.selected) {
      el.sel.textContent = TOWER_DEFS[state.selected].name;
    } else {
      el.sel.textContent = '—';
    }
    Object.keys(TOWER_DEFS).forEach((type) => {
      const btn = document.querySelector(`.tower-btn[data-type="${type}"]`);
      if (!btn) return;
      btn.disabled = state.gold < TOWER_DEFS[type].cost || state.gameOver || !state.mapPicked;
    });
    document.querySelectorAll('.tower-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.type === state.selected);
    });

    const showActions = !!state.selectedTower && !state.gameOver;
    const showConfirm = showActions && state.sellConfirming;
    el.towerBtns.classList.toggle('hidden', showActions);
    el.towerActions.classList.toggle('show', showActions && !showConfirm);
    el.sellConfirm.classList.toggle('show', showConfirm);
    if (showActions) {
      const tw = state.selectedTower;
      const cost = upgradeCostFor(tw);
      const maxed = cost == null;
      const value = sellValueFor(tw);
      el.btnUpgrade.disabled = maxed || state.gold < cost;
      el.upgradeCost.textContent = maxed ? `MAX Lv${MAX_TOWER_LEVEL}` : `${cost}g → Lv${tw.level + 1}`;
      el.sellValue.textContent = `+${value}g`;
      el.btnSell.disabled = false;
      el.sellConfirmValue.textContent = `+${value}g`;
    }
    el.btnSpeed.textContent = `Speed ${state.gameSpeed}x`;
    el.btnSpeed.classList.toggle('active', state.gameSpeed > 1);
    el.btnPause.textContent = state.paused ? 'Resume' : 'Pause';
    el.btnPause.classList.toggle('active', state.paused);
    if (el.btnChangeMap) {
      el.btnChangeMap.disabled = !(state.mapPicked && !state.started && !state.gameOver);
    }
    refreshBestLine();
  }

  function updateWaveButtons() {
    const canStart = state.mapPicked && !state.gameOver && (!state.started || state.awaitingNextWave);
    el.btnNextWave.disabled = !canStart;
    el.btnContinuous.disabled = !canStart;
  }

  function setWaveMode(mode) {
    if (mode !== 'next' && mode !== 'continuous') return;
    state.waveMode = mode;
    if (state.betweenWaves && !state.gameOver && state.started) {
      if (mode === 'continuous') {
        state.awaitingNextWave = false;
        state.nextWaveIn = 1.5;
        el.hint.textContent = `Wave ${state.wave} cleared! Next wave soon…`;
      } else {
        state.awaitingNextWave = true;
        state.nextWaveIn = 0;
        el.hint.textContent = `Wave ${state.wave} cleared! Build up, then press Next Wave.`;
      }
    }
    updateWaveButtons();
  }

  function enterWavePause() {
    state.betweenWaves = true;
    if (state.waveMode === 'continuous') {
      state.awaitingNextWave = false;
      state.nextWaveIn = 1.5;
      el.hint.textContent = `Wave ${state.wave} cleared! Next wave soon…`;
    } else {
      state.awaitingNextWave = true;
      state.nextWaveIn = 0;
      el.hint.textContent = `Wave ${state.wave} cleared! Build up, then press Next Wave.`;
    }
    updateWaveButtons();
  }

  function hideNextWaveUI() {
    state.awaitingNextWave = false;
    updateWaveButtons();
  }

  function flashGold() {
    el.goldStat.classList.remove('flash-gold');
    void el.goldStat.offsetWidth;
    el.goldStat.classList.add('flash-gold');
  }

  function addFloat(x, y, text, color) {
    state.floatingTexts.push({ x, y, text, color, life: 0.9, vy: -40 });
  }

  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.35,
        max: 0.7,
        color,
        r: 2 + Math.random() * 3,
      });
    }
  }

  function placeFeedback(x, y, ok) {
    burst(x, y, ok ? '#38bdf8' : '#f87171', ok ? 14 : 8);
    addFloat(x, y - 18, ok ? 'Built!' : 'Blocked', ok ? '#7dd3fc' : '#fca5a5');
  }

  function getPadAt(mx, my) {
    const R = 28;
    for (let i = 0; i < PADS.length; i++) {
      const p = PADS[i];
      if (Math.hypot(mx - p.x, my - p.y) <= R) return i;
    }
    return -1;
  }

  function isPadOccupied(idx) {
    return state.towers.some(t => t.pad === idx);
  }

  function getTowerAt(mx, my) {
    const R = 34;
    for (let i = state.towers.length - 1; i >= 0; i--) {
      const t = state.towers[i];
      if (Math.hypot(mx - t.x, my - t.y) <= R) return t;
    }
    return null;
  }

  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
    const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY,
    };
  }

  function tryPlace(mx, my) {
    if (state.gameOver || !state.mapPicked) return;

    const hitTower = getTowerAt(mx, my);
    if (hitTower) {
      state.selected = null;
      selectTower(hitTower);
      updateHUD();
      return;
    }

    if (state.selected) {
      const idx = getPadAt(mx, my);
      if (idx < 0) {
        state.selected = null;
        clearTowerSelection();
        el.hint.textContent = 'Build canceled. Tap a tower type, or tap a tower to upgrade';
        updateHUD();
        return;
      }
      if (isPadOccupied(idx)) {
        const occ = state.towers.find(t => t.pad === idx);
        if (occ) {
          state.selected = null;
          selectTower(occ);
          updateHUD();
        }
        return;
      }
      const def = TOWER_DEFS[state.selected];
      if (state.gold < def.cost) {
        el.hint.textContent = 'Not enough gold';
        placeFeedback(PADS[idx].x, PADS[idx].y, false);
        return;
      }
      state.gold -= def.cost;
      flashGold();
      const pad = PADS[idx];
      const placed = {
        pad: idx,
        x: pad.x,
        y: pad.y,
        type: state.selected,
        level: 1,
        cd: 0,
        pulse: 0.4,
      };
      state.towers.push(placed);
      placeFeedback(pad.x, pad.y, true);
      state.selected = null;
      selectTower(placed);
      el.hint.textContent = `${def.name} placed! Upgrade or pick another tower`;
      updateHUD();
      return;
    }

    if (state.selectedTower) {
      clearTowerSelection();
      el.hint.textContent = 'Tap pads to build, tap towers to upgrade';
      updateHUD();
    }
  }

  function upgradeSelectedTower() {
    const tw = state.selectedTower;
    if (!tw || state.gameOver) return;
    const cost = upgradeCostFor(tw);
    if (cost == null) {
      el.hint.textContent = `Already max level (${MAX_TOWER_LEVEL})`;
      return;
    }
    if (state.gold < cost) {
      el.hint.textContent = 'Not enough gold to upgrade';
      flashGold();
      return;
    }
    state.gold -= cost;
    flashGold();
    tw.level = (tw.level || 1) + 1;
    tw.pulse = 0.45;
    burst(tw.x, tw.y, LEVEL_RING[tw.level - 1], 16);
    addFloat(tw.x, tw.y - 20, `Lv${tw.level}!`, LEVEL_RING[tw.level - 1]);
    selectTower(tw);
    updateHUD();
  }

  function sellSelectedTower() {
    const tw = state.selectedTower;
    if (!tw || state.gameOver || !state.sellConfirming) return;
    state.sellConfirming = false;
    const value = sellValueFor(tw);
    state.gold += value;
    flashGold();
    burst(tw.x, tw.y, '#94a3b8', 12);
    addFloat(tw.x, tw.y - 18, `+${value}`, '#fde68a');
    const idx = state.towers.indexOf(tw);
    if (idx >= 0) state.towers.splice(idx, 1);
    clearTowerSelection();
    el.hint.textContent = `Sold for ${value} gold`;
    updateHUD();
  }

  function waveEnemyCount(w) {
    // Gentle climb to 20 waves (HP/speed stay fixed per enemy type)
    return 5 + w * 2 + Math.max(0, w - 10);
  }
  function enemyMixForWave(w) {
    // Same HP/speed always; later waves just skew toward Scouts/Brutes
    if (w <= 2) return ['normal'];
    if (w === 3) return ['normal', 'normal', 'fast'];
    if (w === 4) return ['normal', 'fast', 'normal', 'tank'];
    if (w === 5) return ['normal', 'fast', 'fast', 'tank'];
    if (w === 6) return ['fast', 'normal', 'tank', 'fast'];
    if (w === 7) return ['fast', 'tank', 'normal', 'tank', 'fast'];
    if (w === 8) return ['fast', 'tank', 'tank', 'fast', 'normal'];
    if (w === 9) return ['tank', 'fast', 'tank', 'fast', 'tank'];
    if (w === 10) return ['tank', 'fast', 'tank', 'tank', 'fast', 'tank'];
    if (w <= 12) return ['tank', 'fast', 'tank', 'fast', 'tank', 'normal'];
    if (w <= 14) return ['tank', 'fast', 'tank', 'tank', 'fast', 'tank'];
    if (w <= 16) return ['tank', 'tank', 'fast', 'tank', 'fast', 'tank'];
    if (w <= 18) return ['tank', 'tank', 'fast', 'tank', 'tank', 'fast'];
    return ['tank', 'tank', 'tank', 'fast', 'tank', 'fast'];
  }

  function hardenKind(kind, chance) {
    if (chance <= 0 || Math.random() >= chance) return kind;
    if (kind === 'normal') return 'fast';
    if (kind === 'fast') return 'tank';
    return kind;
  }

  function buildSpawnQueue(w) {
    const map = activeMap();
    const n = waveEnemyCount(w) + (map.spawnExtra || 0);
    const mix = enemyMixForWave(w);
    const chance = map.hardenChance || 0;
    const q = [];
    for (let i = 0; i < n; i++) {
      q.push(hardenKind(mix[i % mix.length], chance));
    }
    // shuffle lightly
    for (let i = q.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = q[i]; q[i] = q[j]; q[j] = tmp;
    }
    return q;
  }

  function startNextWave() {
    if (state.wave >= state.maxWaves) return;
    state.wave++;
    state.spawnQueue = buildSpawnQueue(state.wave);
    state.spawnLeft = state.spawnQueue.length;
    state.spawnCD = 0.35;
    state.betweenWaves = false;
    state.awaitingNextWave = false;
    state.nextWaveIn = 0;
    hideNextWaveUI();
    saveBestWave(state.wave);
    el.hint.textContent = `Wave ${state.wave} incoming!`;
    updateHUD();
  }

  function spawnEnemy(kind) {
    const et = ENEMY_TYPES[kind] || ENEMY_TYPES.normal;
    const hp = et.hp;
    state.enemies.push({
      kind,
      dist: 0,
      baseSpeed: et.speed,
      speed: 0,
      hp,
      maxHp: hp,
      reward: et.reward,
      r: et.r,
      color: et.color,
      stroke: et.stroke,
      hitFlash: 0,
      slowTimer: 0,
      slowMul: 1,
    });
  }

  function victoryRating(livesLeft) {
    if (livesLeft >= START_LIVES) return { stars: '★★★', label: 'Perfect' };
    if (livesLeft >= 4) return { stars: '★★☆', label: 'Good' };
    return { stars: '★☆☆', label: 'Close' };
  }

  function endGame(won) {
    state.gameOver = true;
    state.won = won;
    state.selected = null;
    state.selectedTower = null;
    state.betweenWaves = false;
    state.awaitingNextWave = false;
    state.paused = false;
    hideNextWaveUI();
    el.overlay.classList.add('show');
    if (won) {
      const rating = victoryRating(state.lives);
      saveBestWin(state.lives);
      el.overlayTitle.className = 'win';
      el.overlayTitle.textContent = 'Victory!';
      el.overlayRating.textContent = `${rating.stars}  ${rating.label}`;
      el.overlayMsg.textContent = `Held ${MAPS[state.mapId].name} through ${state.maxWaves} waves with ${state.lives} lives left. Gold: ${Math.floor(state.gold)}.`;
    } else {
      el.overlayTitle.className = 'lose';
      el.overlayTitle.textContent = 'Path Breached';
      el.overlayRating.textContent = '';
      el.overlayMsg.textContent = `Reached wave ${state.wave}/${state.maxWaves} on ${MAPS[state.mapId].name}. Try Frost + Zap on bends!`;
    }
    updateHUD();
  }

  function showMapSelect() {
    state.mapPicked = false;
    el.mapOverlay.classList.add('show');
    el.overlay.classList.remove('show');
    let last = 'serpentine';
    try { last = localStorage.getItem(LS_MAP) || 'serpentine'; } catch (_) {}
    if (!MAPS[last]) last = 'serpentine';
    document.querySelectorAll('.map-pick-btn').forEach(b => {
      b.classList.toggle('last', b.dataset.map === last);
    });
    updateWaveButtons();
    updateHUD();
  }

  function pickMap(mapId) {
    const wasChange = state.changingMap;
    state.changingMap = false;
    // Clear board + reset start economy whenever a map is (re)picked
    state.gold = startGoldForMap(mapId);
    state.lives = START_LIVES;
    state.wave = 0;
    state.selected = null;
    state.selectedTower = null;
    state.towers = [];
    state.enemies = [];
    state.projectiles = [];
    state.particles = [];
    state.floatingTexts = [];
    state.bolts = [];
    state.rings = [];
    state.started = false;
    state.gameOver = false;
    state.won = false;
    state.spawnLeft = 0;
    state.spawnQueue = [];
    state.spawnCD = 0;
    state.betweenWaves = false;
    state.nextWaveIn = 0;
    state.awaitingNextWave = false;
    state.sellConfirming = false;
    applyMap(mapId);
    state.mapPicked = true;
    el.mapOverlay.classList.remove('show');
    el.overlay.classList.remove('show');
    el.hint.textContent = wasChange
      ? 'Map changed — build, then Next Wave'
      : `${MAPS[mapId].name} ready — build on pads, then Next Wave`;
    updateWaveButtons();
    updateHUD();
  }

  function resetGame() {
    state.gold = START_GOLD;
    state.lives = START_LIVES;
    state.wave = 0;
    state.selected = null;
    state.selectedTower = null;
    state.towers = [];
    state.enemies = [];
    state.projectiles = [];
    state.particles = [];
    state.floatingTexts = [];
    state.bolts = [];
    state.rings = [];
    state.changingMap = false;
    state.started = false;
    state.gameOver = false;
    state.won = false;
    state.spawnLeft = 0;
    state.spawnQueue = [];
    state.spawnCD = 0;
    state.betweenWaves = false;
    state.nextWaveIn = 0;
    state.awaitingNextWave = false;
    state.sellConfirming = false;
    state.paused = false;
    hideNextWaveUI();
    el.overlay.classList.remove('show');
    showMapSelect();
    el.hint.textContent = 'Pick a map to begin';
    updateWaveButtons();
    updateHUD();
  }

  // Input
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!state.mapPicked) return;
    const { x, y } = canvasCoords(e);
    tryPlace(x, y);
  });

  document.querySelectorAll('.tower-btn').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (btn.disabled || state.gameOver || !state.mapPicked) return;
      const type = btn.dataset.type;
      clearTowerSelection();
      state.selected = state.selected === type ? null : type;
      el.hint.textContent = state.selected
        ? `Selected ${TOWER_DEFS[type].name} — tap a pad`
        : 'Tap pads to build, tap towers to upgrade';
      updateHUD();
    });
  });

  el.btnUpgrade.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    upgradeSelectedTower();
  });

  el.btnSell.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!state.selectedTower || state.gameOver) return;
    state.sellConfirming = true;
    el.hint.textContent = 'Confirm sell? This cannot be undone.';
    updateHUD();
  });

  el.btnSellYes.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sellSelectedTower();
  });

  el.btnSellNo.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    state.sellConfirming = false;
    if (state.selectedTower) {
      const st = towerStats(state.selectedTower);
      el.hint.textContent = `${st.name} Lv${state.selectedTower.level} — dmg ${st.damage}, range ${Math.round(st.range)}`;
    }
    updateHUD();
  });

  el.btnSpeed.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    state.gameSpeed = state.gameSpeed === 1 ? 2 : 1;
    updateHUD();
  });

  el.btnPause.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.gameOver || !state.mapPicked) return;
    state.paused = !state.paused;
    el.hint.textContent = state.paused ? 'Paused' : (state.started ? 'Resumed' : 'Ready');
    updateHUD();
  });

  el.btnChangeMap.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!(state.mapPicked && !state.started && !state.gameOver)) return;
    state.changingMap = true;
    state.selected = null;
    clearTowerSelection();
    showMapSelect();
    el.hint.textContent = 'Pick a map (same or new)';
  });

  function pressWaveButton(mode) {
    if (state.gameOver || !state.mapPicked) return;
    if (state.paused) {
      state.paused = false;
      updateHUD();
    }
    const canStart = !state.started || state.awaitingNextWave;
    if (!canStart) return;
    state.waveMode = mode;
    if (!state.started) {
      state.started = true;
      startNextWave();
      return;
    }
    if (state.awaitingNextWave) {
      startNextWave();
    }
  }

  el.btnNextWave.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pressWaveButton('next');
  });

  el.btnContinuous.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pressWaveButton('continuous');
  });

  document.getElementById('restart-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resetGame();
  });

  document.querySelectorAll('.map-pick-btn').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pickMap(btn.dataset.map);
    });
  });

  function findTarget(tower) {
    const st = towerStats(tower);
    let best = null;
    let bestDist = -1;
    for (const en of state.enemies) {
      const p = posOnPath(en.dist);
      const d = Math.hypot(p.x - tower.x, p.y - tower.y);
      if (d <= st.range && en.dist > bestDist) {
        bestDist = en.dist;
        best = en;
      }
    }
    return best;
  }

  function applyDamage(en, amount, color) {
    if (!en || !state.enemies.includes(en)) return false;
    en.hp -= amount;
    en.hitFlash = 0.12;
    const p = posOnPath(en.dist);
    burst(p.x, p.y, color, 6);
    if (en.hp <= 0) {
      state.gold += en.reward;
      flashGold();
      burst(p.x, p.y, '#fbbf24', 18);
      addFloat(p.x, p.y - 16, `+${en.reward}`, '#fde68a');
      const idx = state.enemies.indexOf(en);
      if (idx >= 0) state.enemies.splice(idx, 1);
      updateHUD();
      return true;
    }
    return false;
  }

  function applySlow(en, mul, dur) {
    if (!en || !state.enemies.includes(en)) return;
    en.slowMul = Math.min(en.slowMul || 1, mul);
    en.slowTimer = Math.max(en.slowTimer || 0, dur);
  }

  function findTargetsInRange(tower, maxN) {
    const st = towerStats(tower);
    const list = [];
    for (const en of state.enemies) {
      const p = posOnPath(en.dist);
      const d = Math.hypot(p.x - tower.x, p.y - tower.y);
      if (d <= st.range) list.push({ en, progress: en.dist });
    }
    list.sort((a, b) => b.progress - a.progress);
    return list.slice(0, maxN).map((x) => x.en);
  }

  function fireZap(tw, st) {
    const targets = findTargetsInRange(tw, st.multi || 3);
    if (!targets.length) return false;
    for (let i = 0; i < targets.length; i++) {
      const en = targets[i];
      if (!state.enemies.includes(en)) continue;
      const p = posOnPath(en.dist);
      const hitDmg = i === 0
        ? st.damage
        : Math.max(1, Math.round(st.damage * Math.pow(st.multiFalloff || 0.7, i)));
      state.bolts.push({
        x1: tw.x, y1: tw.y, x2: p.x, y2: p.y,
        life: 0.22, color: st.projectileColor,
      });
      applyDamage(en, hitDmg, st.projectileColor);
    }
    burst(tw.x, tw.y, st.projectileColor, 8);
    return true;
  }

  function applyCannonSplash(impactX, impactY, primary, damage, splashRadius, splashMul, color) {
    state.rings.push({
      x: impactX, y: impactY,
      r: 10, maxR: splashRadius,
      life: 0.32, maxLife: 0.32,
      color,
    });
    burst(impactX, impactY, color, 18);
    const secondary = Math.max(1, Math.round(damage * splashMul));
    // snapshot because applyDamage may splice
    const others = state.enemies.slice();
    for (const en of others) {
      if (en === primary) continue;
      if (!state.enemies.includes(en)) continue;
      const p = posOnPath(en.dist);
      if (Math.hypot(p.x - impactX, p.y - impactY) <= splashRadius) {
        applyDamage(en, secondary, color);
      }
    }
  }

  function update(dt) {
    if (state.gameOver) {
      // animate fx only
    } else if (state.paused || !state.mapPicked) {
      // frozen
    } else if (state.started) {
      if (state.spawnLeft > 0) {
        state.spawnCD -= dt;
        if (state.spawnCD <= 0) {
          const kind = state.spawnQueue.shift() || 'normal';
          spawnEnemy(kind);
          state.spawnLeft = state.spawnQueue.length;
          state.spawnCD = Math.max(0.28, 0.8 - state.wave * 0.06);
        }
      } else if (state.enemies.length === 0 && !state.betweenWaves) {
        if (state.wave >= state.maxWaves) {
          endGame(true);
        } else {
          enterWavePause();
        }
      }

      if (state.betweenWaves && state.waveMode === 'continuous' && !state.awaitingNextWave) {
        state.nextWaveIn -= dt;
        if (state.nextWaveIn <= 0) startNextWave();
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const en = state.enemies[i];
        if (en.slowTimer > 0) {
          en.slowTimer -= dt;
          if (en.slowTimer <= 0) en.slowMul = 1;
        }
        const spd = en.baseSpeed * (en.slowMul || 1);
        en.speed = spd;
        en.dist += spd * dt;
        if (en.hitFlash > 0) en.hitFlash -= dt;
        if (en.dist >= PATH_LEN) {
          state.enemies.splice(i, 1);
          state.lives--;
          burst(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y, '#f87171', 12);
          addFloat(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y - 20, '-1 life', '#fca5a5');
          updateHUD();
          if (state.lives <= 0) endGame(false);
        }
      }

      for (const tw of state.towers) {
        const st = towerStats(tw);
        if (tw.pulse > 0) tw.pulse -= dt;
        tw.cd -= dt;
        if (tw.cd <= 0) {
          if (tw.type === 'zap') {
            if (fireZap(tw, st)) {
              tw.cd = st.fireRate;
              tw.pulse = 0.15;
            }
          } else {
            const tgt = findTarget(tw);
            if (tgt) {
              const lead = Math.min(40, tgt.baseSpeed * 0.15);
              const aim = posOnPath(Math.min(PATH_LEN, tgt.dist + lead));
              state.projectiles.push({
                x: tw.x, y: tw.y,
                tx: aim.x, ty: aim.y,
                speed: st.projectileSpeed,
                damage: st.damage,
                color: st.projectileColor,
                target: tgt,
                type: tw.type,
                slowMul: st.slowMul,
                slowDur: st.slowDur,
                splashRadius: st.splashRadius,
                splashMul: st.splashMul,
              });
              tw.cd = st.fireRate;
              tw.pulse = 0.15;
            }
          }
        }
      }

      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const pr = state.projectiles[i];
        let aimX = pr.tx, aimY = pr.ty;
        if (pr.target && state.enemies.includes(pr.target)) {
          const p = posOnPath(pr.target.dist);
          aimX = p.x; aimY = p.y;
        }
        const dx = aimX - pr.x, dy = aimY - pr.y;
        const dist = Math.hypot(dx, dy);
        const step = pr.speed * dt;
        if (dist <= step || dist < 8) {
          const en = pr.target;
          if (en && state.enemies.includes(en)) {
            const p = posOnPath(en.dist);
            const killed = applyDamage(en, pr.damage, pr.color);
            if (pr.type === 'frost' && pr.slowMul && !killed) {
              applySlow(en, pr.slowMul, pr.slowDur || 1.4);
              burst(p.x, p.y, '#a5f3fc', 10);
            }
            if (pr.type === 'cannon') {
              applyCannonSplash(
                p.x, p.y, en, pr.damage,
                pr.splashRadius || 45,
                pr.splashMul || 0.5,
                pr.color
              );
            }
          } else if (pr.type === 'cannon') {
            applyCannonSplash(
              pr.x, pr.y, null, pr.damage,
              pr.splashRadius || 45,
              pr.splashMul || 0.5,
              pr.color
            );
          } else {
            burst(pr.x, pr.y, pr.color, 4);
          }
          state.projectiles.splice(i, 1);
        } else {
          pr.x += (dx / dist) * step;
          pr.y += (dy / dist) * step;
        }
      }
    }

    for (let i = state.bolts.length - 1; i >= 0; i--) {
      state.bolts[i].life -= dt;
      if (state.bolts[i].life <= 0) state.bolts.splice(i, 1);
    }
    for (let i = state.rings.length - 1; i >= 0; i--) {
      const ring = state.rings[i];
      ring.life -= dt;
      const t = 1 - Math.max(0, ring.life) / ring.maxLife;
      ring.r = ring.maxR * (0.25 + 0.75 * t);
      if (ring.life <= 0) state.rings.splice(i, 1);
    }
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const f = state.floatingTexts[i];
      f.life -= dt;
      f.y += f.vy * dt;
      if (f.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  function drawPath() {
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    for (let y = 0; y < H; y += 40) {
      for (let x = 0; x < W; x += 40) {
        if ((x / 40 + y / 40) % 2 === 0) {
          ctx.fillStyle = 'rgba(30, 58, 95, 0.15)';
          ctx.fillRect(x, y, 40, 40);
        }
      }
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 26;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();

    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(PATH[0].x, PATH[0].y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRangePreview() {
    // Selected tower range
    if (state.selectedTower) {
      const st = towerStats(state.selectedTower);
      ctx.beginPath();
      ctx.arc(state.selectedTower.x, state.selectedTower.y, st.range, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(192, 132, 252, 0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // Build-type selected: show range ghost on empty pads
    if (state.selected && TOWER_DEFS[state.selected]) {
      const def = TOWER_DEFS[state.selected];
      for (let i = 0; i < PADS.length; i++) {
        if (isPadOccupied(i)) continue;
        const p = PADS[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, def.range, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function drawPads() {
    const t = performance.now() / 1000;
    for (let i = 0; i < PADS.length; i++) {
      const p = PADS[i];
      const occ = isPadOccupied(i);
      const highlight = state.selected && !occ && !state.gameOver;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
      if (occ) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
      } else if (highlight) {
        const pulse = 0.55 + Math.sin(t * 4) * 0.25;
        ctx.fillStyle = `rgba(56, 189, 248, ${0.15 + pulse * 0.15})`;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      if (!occ) {
        ctx.fillStyle = highlight ? '#7dd3fc' : '#64748b';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', p.x, p.y + 1);
      }
    }
  }

  function drawTowers() {
    for (const tw of state.towers) {
      const def = TOWER_DEFS[tw.type];
      const st = towerStats(tw);
      const lv = tw.level || 1;
      const ringColor = LEVEL_RING[Math.min(lv, MAX_TOWER_LEVEL) - 1];
      const isSel = state.selectedTower === tw;
      const levelBump = 1 + (lv - 1) * 0.07;
      const scale = levelBump * (1 + (tw.pulse > 0 ? tw.pulse * 0.35 : 0));
      ctx.save();
      ctx.translate(tw.x, tw.y);
      ctx.scale(scale, scale);
      if (isSel) {
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(192, 132, 252, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = 3 + (lv - 1) * 0.4;
      ctx.stroke();

      if (tw.type === 'archer') {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(8, 8);
        ctx.lineTo(-8, 8);
        ctx.closePath();
        ctx.fill();
      } else if (tw.type === 'cannon') {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-3, -10, 6, 8);
      } else if (tw.type === 'frost') {
        // Clear 6-arm snowflake (not a triangle like Archer)
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
          const cos = Math.cos(a), sin = Math.sin(a);
          const px = -sin, py = cos;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(cos * 10, sin * 10);
          ctx.stroke();
          // mid barbs
          const mx = cos * 5.5, my = sin * 5.5;
          ctx.beginPath();
          ctx.moveTo(mx + px * 3.5, my + py * 3.5);
          ctx.lineTo(mx, my);
          ctx.lineTo(mx - px * 3.5, my - py * 3.5);
          ctx.stroke();
          // outer cross-ticks
          const ox = cos * 8.2, oy = sin * 8.2;
          ctx.beginPath();
          ctx.moveTo(ox + px * 2.4, oy + py * 2.4);
          ctx.lineTo(ox - px * 2.4, oy - py * 2.4);
          ctx.stroke();
        }
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath();
        ctx.arc(0, 0, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#a5f3fc';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (tw.type === 'zap') {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.moveTo(-2, -11);
        ctx.lineTo(6, -1);
        ctx.lineTo(1, -1);
        ctx.lineTo(4, 11);
        ctx.lineTo(-6, 1);
        ctx.lineTo(-1, 1);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(tw.x + 12, tw.y - 12, 8, 0, Math.PI * 2);
      ctx.fillStyle = ringColor;
      ctx.fill();
      ctx.fillStyle = '#0f1419';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(lv), tw.x + 12, tw.y - 11);
    }
  }

  function drawEnemies() {
    for (const en of state.enemies) {
      const p = posOnPath(en.dist);
      en.x = p.x; en.y = p.y;
      const slowed = (en.slowTimer || 0) > 0;
      ctx.beginPath();
      if (en.kind === 'tank') {
        const s = en.r * 0.85;
        ctx.rect(p.x - s, p.y - s, s * 2, s * 2);
      } else if (en.kind === 'fast') {
        ctx.moveTo(p.x, p.y - en.r);
        ctx.lineTo(p.x + en.r, p.y + en.r * 0.7);
        ctx.lineTo(p.x - en.r, p.y + en.r * 0.7);
        ctx.closePath();
      } else {
        ctx.arc(p.x, p.y, en.r, 0, Math.PI * 2);
      }
      ctx.fillStyle = en.hitFlash > 0 ? '#fecaca' : (slowed ? '#7dd3fc' : en.color);
      ctx.fill();
      ctx.strokeStyle = en.stroke;
      ctx.lineWidth = 2;
      ctx.stroke();
      const bw = Math.max(18, en.r * 1.6), bh = 4;
      const ratio = Math.max(0, en.hp / en.maxHp);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(p.x - bw / 2, p.y - en.r - 10, bw, bh);
      ctx.fillStyle = ratio > 0.4 ? '#4ade80' : '#f87171';
      ctx.fillRect(p.x - bw / 2, p.y - en.r - 10, bw * ratio, bh);
    }
  }

  function drawProjectiles() {
    for (const pr of state.projectiles) {
      ctx.beginPath();
      const r = pr.type === 'cannon' ? 6 : pr.type === 'zap' ? 3 : pr.type === 'frost' ? 4.5 : 3.5;
      ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
      ctx.fillStyle = pr.color;
      ctx.shadowColor = pr.color;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawBolts() {
    for (const b of state.bolts) {
      ctx.globalAlpha = Math.max(0, b.life / 0.22);
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2.8;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      // jagged lightning
      const mx = (b.x1 + b.x2) / 2 + (Math.random() - 0.5) * 14;
      const my = (b.y1 + b.y2) / 2 + (Math.random() - 0.5) * 14;
      ctx.lineTo(mx, my);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  function drawRings() {
    for (const ring of state.rings) {
      const a = Math.max(0, ring.life / ring.maxLife);
      ctx.globalAlpha = a * 0.85;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 3;
      ctx.shadowColor = ring.color;
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const f of state.floatingTexts) {
      ctx.globalAlpha = Math.max(0, f.life / 0.9);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawPausedBanner() {
    if (!state.paused || state.gameOver || !state.mapPicked) return;
    ctx.fillStyle = 'rgba(15, 20, 25, 0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
  }

  function draw() {
    drawPath();
    drawRangePreview();
    drawPads();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawBolts();
    drawRings();
    drawParticles();
    drawPausedBanner();
  }

  let last = performance.now();
  function frame(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    const dt = state.paused ? 0 : raw * state.gameSpeed;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // Init map from last selection for preview path under overlay
  let initialMap = 'serpentine';
  try { initialMap = localStorage.getItem(LS_MAP) || 'serpentine'; } catch (_) {}
  applyMap(MAPS[initialMap] ? initialMap : 'serpentine');
  showMapSelect();
  updateWaveButtons();
  updateHUD();
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  const BOOT = 'pg-boot-v12';
  (async () => {
    try {
      if (!sessionStorage.getItem(BOOT)) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        sessionStorage.setItem(BOOT, '1');
        location.reload();
        return;
      }
    } catch (_) {}
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  })();
}
function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) req.call(el).catch(() => {});
}
</script>
</body>
